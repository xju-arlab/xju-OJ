[project]
name = "xju-ai-notebook"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel==7.4.0",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "torch==2.14.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
