# Separate project and data; Codabench has no public browser or host ports.
x-proxy: &proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "*"
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
  networks: [control]
  environment: *proxy
x-site: &site
  <<: *common
  image: ${AI_SITE_IMAGE:?}
  env_file: ${AI_RUNTIME:?}/service.env
  environment:
    <<: *proxy
    XJU_EVALUATION_IMAGE: ${AI_NOTEBOOK_IMAGE:?}
  secrets: [coda_secret]
  volumes:
    - ${AI_RUNTIME}/exports:/exports
  tmpfs: [/tmp:size=64m, /codalab_tmp:size=64m]
  mem_limit: 512m
  cpus: 0.75

services:
  db:
    <<: *common
    image: ${AI_POSTGRES_IMAGE:?}
    env_file: ${AI_RUNTIME}/postgres.env
    volumes: [database:/var/lib/postgresql]
    mem_limit: 256m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U codabench -d codabench"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *common
    image: redis:8.2.8-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --appendonly, "yes"]
    volumes: [redis:/data]
    mem_limit: 128m
  rabbit:
    <<: *common
    image: ${AI_RABBIT_IMAGE:-rabbitmq:4.2.4-management@sha256:aeee1db0ff9fdb1347f3585242c14ed10877b56c22eeaa113b21208ef3dd3edf}
    hostname: rabbit
    env_file: ${AI_RUNTIME}/rabbit.env
    volumes: [rabbit:/var/lib/rabbitmq]
    mem_limit: 384m
    environment:
      <<: *proxy
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
  minio:
    <<: *common
    image: ${AI_MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: [server, /data]
    env_file: ${AI_RUNTIME}/minio.env
    volumes: [objects:/data]
    mem_limit: 384m
  codabench:
    <<: *site
    depends_on:
      db: {condition: service_healthy}
      rabbit: {condition: service_healthy}
  site-worker:
    <<: *site
    command: [celery, -A, celery_config, worker, -Q, site-worker, --loglevel=WARNING, --concurrency=1]
    depends_on: [codabench, redis]
  compute:
    <<: *common
    image: ${AI_COMPUTE_IMAGE:?}
    env_file: ${AI_RUNTIME}/service.env
    environment:
      <<: *proxy
      HOST_DIRECTORY: ${AI_WORKSPACE_PATH:?}
      XJU_EVALUATION_IMAGE: ${AI_NOTEBOOK_IMAGE:?}
      COMPETITION_ALLOW_IMAGE_PULL: "false"
      USE_GPU: "false"
    volumes:
      - workspace:/codabench
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256m
    depends_on: [site-worker]
  notebook-agent:
    <<: *common
    image: ${AI_COMPUTE_IMAGE:?}
    command: [python, /opt/bridge/worker.py]
    env_file: ${AI_RUNTIME}/service.env
    environment:
      <<: *proxy
      AI_WORKER_NAME: notebook-1
      AI_WORKER_KINDS: notebook
      AI_NOTEBOOK_IMAGE: ${AI_NOTEBOOK_IMAGE:?}
      AI_NOTEBOOK_MAX_KERNELS: ${AI_NOTEBOOK_MAX_KERNELS:-3}
      AI_NOTEBOOK_MEMORY_MB: ${AI_NOTEBOOK_MEMORY_MB:-1024}
      AI_NOTEBOOK_IDLE_SECONDS: ${AI_NOTEBOOK_IDLE_SECONDS:-600}
    secrets: [oj_worker_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AI_DOCKER_CLI:-/usr/bin/docker}:/usr/local/bin/docker:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 128m
  evaluation-agent:
    <<: *common
    image: ${AI_COMPUTE_IMAGE:?}
    command: [python, /opt/bridge/worker.py]
    env_file: ${AI_RUNTIME}/service.env
    environment:
      <<: *proxy
      AI_WORKER_NAME: evaluation-1
      AI_WORKER_KINDS: evaluation
    secrets: [oj_worker_token, coda_token]
    mem_limit: 128m
    depends_on: [codabench, compute]
    extra_hosts: ["host.docker.internal:host-gateway"]

secrets:
  coda_secret: {file: "${AI_RUNTIME}/secrets/coda_secret"}
  coda_token: {file: "${AI_RUNTIME}/secrets/coda_token"}
  oj_worker_token: {file: "${AI_RUNTIME}/secrets/oj_worker_token"}
networks:
  control: {}
volumes:
  database: {}
  redis: {}
  rabbit: {}
  objects: {}
  workspace:
    external: true
    name: ${AI_WORKSPACE_VOLUME:?}
